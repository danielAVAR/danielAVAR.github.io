<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d32">
  <meta name="description" content="Portfolio de Daniel Aguilar Rodríguez, desarrollador de software en Guatemala. Backend, APIs y experiencias digitales.">
  <title>Daniel Aguilar Rodríguez — Desarrollador de software</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header-controls" aria-label="Preferencias">
    <button class="language-toggle" id="language-toggle" type="button" aria-label="Switch language to English">EN</button>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo noche"><span id="theme-icon" aria-hidden="true">☾</span></button>
  </div>
  <main>
    <!-- Sequence viewport: the whole portfolio lives inside this scroll-driven scene. -->
    <section class="sequence-stage" id="portfolio" aria-label="Portfolio Fibonacci de Daniel Aguilar">
      <div class="sequence-screen">
        <!-- The previous scene stays below while the next Fibonacci scene manifests. -->
        <div class="scene-layer scene-layer--base" id="scene-base"></div>
        <div class="scene-layer scene-layer--incoming" id="scene-incoming" aria-live="polite"></div>
        <p class="scroll-hint" id="scroll-hint" aria-hidden="true"> :D <span>↓</span></p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
